name: Safety Monitor Verification

on:
  push:
    branches: [master, "wave-1/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: safety-monitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: false

      - name: Install package and quality tools
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Lint, format, and compile
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          python -m compileall -q src tests scripts

      - name: Build source and wheel distributions
        run: python -m build --outdir artifacts/dist

      - name: Verify README contract and CLI
        run: |
          safety-monitor-verify-readme
          mkdir -p artifacts
          safety-monitor --tool git --args "status --short" > artifacts/cli-review.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("artifacts/cli-review.json").read_text(encoding="utf-8"))
          assert payload["decision"] == "allow"
          assert payload["rule_id"] == "ASM-ALLOW-DEFAULT"
          assert "confidence" not in payload
          assert "answer" not in payload
          PY

      - name: Run positive-count tests and build receipt
        shell: bash
        run: |
          set +e
          pytest --junitxml=artifacts/pytest.xml
          pytest_exit=$?
          set -e
          python scripts/verify_junit.py \
            --junit artifacts/pytest.xml \
            --output artifacts/test-receipt.json \
            --pytest-exit-code "$pytest_exit" \
            --commit-sha "$GITHUB_SHA" \
            --python-version "${{ matrix.python-version }}"

      - name: Upload bounded verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: safety-monitor-python-${{ matrix.python-version }}
          path: artifacts/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14
