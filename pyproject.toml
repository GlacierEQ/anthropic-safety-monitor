[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "anthropic-safety-monitor"
version = "1.0.0"
description = "Deterministic policy review for proposed agent tool calls."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Casey Barton" }]
keywords = ["agents", "safety", "policy", "tool-use", "review"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["defusedxml>=0.7.1,<1"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
safety-monitor = "anthropic_safety_monitor.__main__:main"
safety-monitor-verify-readme = "scripts.verify_readme_contract:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anthropic_safety_monitor", "scripts"]

[tool.hatch.build.targets.wheel.force-include]
"src/safety_monitor.py" = "safety_monitor.py"
"README.md" = "scripts/README.md"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["anthropic_safety_monitor", "scripts"]
